<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="531">
<meta name="theme-color" content="#08080a">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180.png">
<link rel="apple-touch-icon" sizes="512x512" href="apple-touch-icon.png">
<link rel="icon" sizes="512x512" href="apple-touch-icon.png">
<title>531 Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️</text></svg>">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08080a;--sf:#111114;--sf2:#18181c;
  --bd:#1e1e24;--bd2:#28282f;
  --tx:#e2ded6;--txm:#807b72;--txd:#4a4640;
  --ac:#c4a265;--acBg:rgba(196,162,101,0.07);--acBd:rgba(196,162,101,0.18);
  --gn:#5a9a5c;--rd:#8a4a4a;
}
html{background:var(--bg);color:var(--tx);font-family:'Newsreader','Georgia',serif;-webkit-font-smoothing:antialiased;line-height:1.55}
body{max-width:460px;margin:0 auto;padding-bottom:72px;min-height:100vh;min-height:100dvh}
body.timer-running{padding-bottom:116px}
input,textarea,button{font-family:inherit}
.page{padding:20px 16px;padding-top:calc(20px + env(safe-area-inset-top))}
.header{margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--bd)}
.meta-row{display:flex;justify-content:space-between;margin-bottom:8px}
.meta-gold{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ac);font-family:system-ui,sans-serif}
.meta-dim{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--txd);font-family:system-ui,sans-serif}
h1{font-size:28px;font-weight:400;font-style:italic;margin:0 0 6px;letter-spacing:-0.3px}
.tm-row{display:flex;justify-content:space-between;align-items:center}
.tm-label{font-size:14px;color:var(--txm)}
.tm-history{font-size:12px;color:var(--txd);font-family:system-ui,sans-serif;margin-top:3px}
.link{font-size:12px;color:var(--ac);cursor:pointer;font-family:system-ui,sans-serif;border-bottom:1px dotted var(--ac)}
.card{background:var(--sf);border-radius:14px;padding:16px 18px;border:1px solid var(--bd);margin-bottom:12px}
.card-head{display:flex;justify-content:space-between;align-items:center}
.card-title{font-size:13px;font-weight:600;letter-spacing:0.3px;margin:0;font-family:system-ui,sans-serif;color:var(--tx)}
.toggle{color:var(--txd);font-size:18px;cursor:pointer;padding:0 4px;background:none;border:none}
.desc{font-size:14px;color:var(--txm);margin:8px 0 12px;line-height:1.6}
.preview{font-size:14px;color:var(--txd);margin:6px 0 0;font-style:italic}
.info-box{font-size:14px;color:var(--txm);margin:10px 0;padding:12px 14px;background:var(--sf2);border-radius:10px;line-height:1.6;border-left:3px solid var(--ac)}
.chk{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--bd2);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--bg);flex-shrink:0;cursor:pointer}
.chk.on{background:var(--ac);border-color:var(--ac)}
.mob-toggle{display:flex;justify-content:space-between;align-items:center;padding:6px 0;cursor:pointer;margin-top:4px}
.mob-txt{font-size:13px;color:var(--txd);font-family:system-ui,sans-serif}
.mob-list{padding-top:4px}
.mob-item{font-size:13px;color:var(--txm);padding:3px 0}
.warm-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.warm-cell{background:var(--sf2);border-radius:10px;padding:12px 8px;text-align:center;border:1px solid var(--bd);cursor:pointer;position:relative;transition:opacity .15s}
.warm-cell.done{opacity:.35}
.warm-wt{font-size:20px;font-weight:700;font-family:system-ui,sans-serif}
.warm-reps{font-size:12px;color:var(--txm);margin-top:2px}
.plate-text{font-size:10px;color:var(--txd);margin-top:4px;font-family:system-ui,sans-serif;line-height:1.3}
.mini-chk{position:absolute;top:6px;right:8px;font-size:12px;color:var(--gn)}
.lb{font-size:11px;font-weight:400;color:var(--txm);margin-left:1px}
.work-list{display:flex;flex-direction:column;gap:8px}
.work-row{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--sf2);border-radius:12px;border:1px solid var(--bd);cursor:pointer;position:relative;transition:opacity .15s}
.work-row.gold{border-color:var(--acBd);background:var(--acBg)}
.work-row.done{opacity:.35}
.work-left{flex:1}.work-right{text-align:right}
.work-label{font-size:11px;color:var(--txd);font-family:system-ui,sans-serif;letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
.work-wt{font-size:26px;font-weight:700;font-family:system-ui,sans-serif;letter-spacing:-1px}
.work-reps{font-size:16px;color:var(--txm);font-family:system-ui,sans-serif;margin-bottom:2px}
.work-reps.gold-text{color:var(--ac);font-weight:600}
.work-pct{font-size:11px;color:var(--txd);font-family:system-ui,sans-serif}
.big-chk{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:20px;color:var(--gn)}
.gold-box{margin-top:14px;padding:14px 16px;background:var(--acBg);border-radius:10px;border:1px solid var(--acBd)}
label.lbl{font-size:14px;color:var(--ac);display:block;margin-bottom:2px}
.hint{font-size:12px;color:var(--txd);margin:0 0 8px;line-height:1.5}
input.inp{width:100%;padding:10px 12px;font-size:18px;font-family:system-ui,sans-serif;font-weight:600;background:var(--bg);border:1px solid var(--bd);border-radius:8px;color:var(--tx);outline:none}
textarea.ta{width:100%;padding:10px 12px;font-size:15px;font-family:'Newsreader',serif;background:var(--bg);border:1px solid var(--bd);border-radius:8px;color:var(--tx);outline:none;resize:vertical;line-height:1.5}
.rest-box{font-size:13px;color:var(--txm);margin-top:12px;padding:10px 14px;background:var(--sf2);border-radius:8px;line-height:1.5;font-family:system-ui,sans-serif}
.assist-list{display:flex;flex-direction:column;gap:6px}
.assist-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--sf2);border-radius:10px;border:1px solid var(--bd);cursor:pointer;transition:all .15s}
.assist-row.sel{border-color:var(--acBd);background:var(--acBg)}
.assist-row.locked{opacity:.25;cursor:default}
.assist-info{flex:1}
.assist-name{font-size:15px;font-weight:500;cursor:pointer;border-bottom:1px dotted var(--txd)}
.assist-name.expanded{border-bottom:none}
.assist-meta{font-size:12px;color:var(--txm);font-family:system-ui,sans-serif;margin-top:2px}
.badge{font-size:10px;color:var(--ac);font-family:system-ui,sans-serif;text-transform:uppercase;letter-spacing:1px;background:var(--acBg);padding:3px 8px;border-radius:4px}
.tap-hint{font-size:11px;color:var(--txd);font-family:system-ui,sans-serif}
.ex-info{font-size:13px;color:var(--txm);padding:10px 14px;margin:4px 0;background:var(--bg);border-radius:8px;line-height:1.6;border-left:2px solid var(--ac)}
.abs-name{font-size:17px;font-weight:500;cursor:pointer;border-bottom:1px dotted var(--txd)}
.abs-name.expanded{border-bottom:none}
.abs-reps{font-size:13px;color:var(--txm);font-family:system-ui,sans-serif;margin-top:6px}
.btn{width:100%;padding:15px;font-size:14px;font-weight:600;font-family:system-ui,sans-serif;letter-spacing:.5px;text-transform:uppercase;background:var(--ac);color:var(--bg);border:none;border-radius:10px;cursor:pointer;margin-top:14px}
.btn.off{background:var(--bd);color:var(--txd);cursor:default}
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--gn);color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-family:system-ui,sans-serif;font-weight:600;z-index:400;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}
.time-note{text-align:center;font-size:12px;color:var(--txd);padding:16px 0;font-family:system-ui,sans-serif}
.coach-loading{padding:20px 0;text-align:center;font-size:13px;color:var(--txm);font-family:system-ui,sans-serif;font-style:italic}
.coach-body{margin-top:10px}
.coach-p{font-size:14px;color:var(--tx);margin:0 0 12px;line-height:1.65}
.coach-meta{font-size:11px;color:var(--txd);font-family:system-ui,sans-serif;margin-top:8px;font-style:italic}
.hist-entry{border-bottom:1px solid var(--bd);padding:8px 0}
.hist-row{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-family:system-ui,sans-serif}
.hist-date{font-size:12px;color:var(--txd);min-width:50px}
.hist-lift{font-size:13px;color:var(--txm);flex:1;margin-left:8px}
.hist-detail{font-weight:600}
.hist-note{font-size:12px;color:var(--txd);font-style:italic;margin-top:4px;line-height:1.5}
.hist-skip{font-size:11px;color:var(--rd);font-family:system-ui,sans-serif;margin-top:3px;opacity:.8}
.roadmap{display:flex;flex-direction:column}
.rm-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-left:2px solid var(--bd);margin-left:8px;padding-left:16px;position:relative}
.rm-item.active{border-left-color:var(--ac)}
.rm-dot{font-size:14px;color:var(--txd);position:absolute;left:-8px;background:var(--sf);padding:2px}
.rm-label{font-size:14px;font-weight:500}
.rm-label.gold-text{color:var(--ac)}
.rm-sub{font-size:12px;color:var(--txd);font-family:system-ui,sans-serif}
.rm-note{font-size:12px;color:var(--txd);margin-top:8px;font-family:system-ui,sans-serif;font-style:italic;text-align:center}
.order-row{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:15px}
.order-row.active{font-weight:600}
.order-num{font-size:12px;color:var(--txd);font-family:system-ui,sans-serif;width:20px;text-align:center}
.gold-text{color:var(--ac)}
.edit-btn{font-size:11px;color:var(--ac);background:none;border:1px solid var(--acBd);border-radius:6px;padding:4px 10px;cursor:pointer;font-family:system-ui,sans-serif;letter-spacing:.5px;text-transform:uppercase}
.max-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.max-cell{background:var(--sf2);border-radius:10px;padding:14px;text-align:center;border:1px solid var(--bd)}
.max-label{font-size:12px;color:var(--txm);font-family:system-ui,sans-serif;margin-bottom:4px}
.max-val{font-size:26px;font-weight:700;font-family:system-ui,sans-serif}
input.max-input{width:80%;padding:8px;font-size:22px;font-family:system-ui,sans-serif;font-weight:700;background:var(--bg);border:1px solid var(--bd);border-radius:6px;color:var(--tx);text-align:center;outline:none}
.max-inc{font-size:11px;color:var(--txd);margin-top:4px;font-family:system-ui,sans-serif}
.bw-scroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;margin-top:8px}
.bw-cell{text-align:center;flex-shrink:0}
.bw-date{font-size:10px;color:var(--txd);font-family:system-ui,sans-serif}
.bw-val{font-size:18px;font-weight:600;font-family:system-ui,sans-serif;margin-top:2px}
.reset-btn{width:100%;padding:12px;font-size:11px;font-family:system-ui,sans-serif;letter-spacing:1px;text-transform:uppercase;background:none;color:var(--rd);border:1px solid var(--rd);border-radius:8px;cursor:pointer}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;display:flex;background:var(--sf);border-top:1px solid var(--bd);z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;padding:10px 0 8px;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--txd)}
.nav-btn.on{color:var(--ac)}
.nav-icon{font-size:18px}
.nav-txt{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;font-family:system-ui,sans-serif}
.hidden{display:none}
.gap-banner{font-size:13px;color:var(--txm);padding:10px 14px;background:var(--sf);border:1px solid var(--bd);border-radius:10px;margin-bottom:12px;line-height:1.5;font-family:system-ui,sans-serif}
.gap-banner.warn{border-color:var(--rd);color:var(--tx);background:rgba(138,74,74,0.1)}
.stall-banner{font-size:13px;color:var(--tx);padding:10px 14px;background:rgba(138,74,74,0.1);border:1px solid var(--rd);border-radius:10px;margin-bottom:12px;line-height:1.5;font-family:system-ui,sans-serif}
.stall-banner .update-tm-link{font-size:12px;color:var(--ac);cursor:pointer;font-family:system-ui,sans-serif;border-bottom:1px dotted var(--ac);display:inline-block;margin-top:6px}

/* Mini timer bar — non-blocking, docks above nav */
.timer-bar{position:fixed;bottom:calc(56px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:100%;max-width:460px;background:var(--sf);border-top:2px solid var(--ac);display:flex;align-items:center;padding:10px 16px;gap:10px;z-index:200;font-family:system-ui,sans-serif}
.timer-bar-time{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ac);min-width:52px}
.timer-bar-label{flex:1;font-size:13px;color:var(--txm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer-bar-done{flex:1;font-size:13px;font-weight:600;color:var(--gn)}
.timer-bar-dismiss{font-size:16px;color:var(--txd);background:none;border:none;cursor:pointer;padding:4px 6px;line-height:1}

/* Warmup quick-pick */
.warmup-quick{display:flex;gap:8px;margin-top:10px}
.warmup-quick-btn{flex:1;padding:14px 8px;font-size:13px;font-family:system-ui,sans-serif;font-weight:600;background:var(--sf2);border:1px solid var(--bd);border-radius:10px;color:var(--txm);cursor:pointer;text-align:center;transition:all .15s;line-height:1.3}
.warmup-quick-btn.done{border-color:var(--gn);color:var(--gn);background:rgba(90,154,92,0.08)}
.warmup-quick-btn.active-opt{border-color:var(--acBd);color:var(--ac);background:var(--acBg)}

/* AMRAP feedback */
.amrap-feedback{font-size:13px;margin-top:10px;padding:10px 12px;border-radius:8px;font-family:system-ui,sans-serif;line-height:1.5}
.amrap-feedback.good{background:rgba(90,154,92,0.08);color:var(--gn);border:1px solid rgba(90,154,92,0.2)}
.amrap-feedback.warn{background:var(--acBg);color:var(--ac);border:1px solid var(--acBd)}
.amrap-feedback.high{background:rgba(196,162,101,0.12);color:var(--ac);border:1px solid var(--acBd)}

/* Skip confirm */
.skip-confirm{margin-top:12px;padding:14px;background:rgba(138,74,74,0.08);border:1px solid rgba(138,74,74,0.25);border-radius:10px;font-family:system-ui,sans-serif}
.skip-confirm-msg{font-size:13px;color:var(--tx);margin-bottom:12px;line-height:1.5}
.skip-confirm-btns{display:flex;gap:8px}
.skip-confirm-ok{flex:1;padding:12px;font-size:13px;font-family:system-ui,sans-serif;font-weight:600;background:var(--ac);color:var(--bg);border:none;border-radius:8px;cursor:pointer;letter-spacing:.3px}
.skip-confirm-cancel{flex:1;padding:12px;font-size:13px;font-family:system-ui,sans-serif;background:var(--sf2);color:var(--txm);border:1px solid var(--bd);border-radius:8px;cursor:pointer}

/* TM bump panel (post-deload cycle complete) */
.cycle-complete-panel{background:var(--sf2);border:1px solid var(--acBd);border-radius:12px;padding:16px;margin-top:12px}
.tm-bump-row{display:flex;justify-content:space-between;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--bd)}
.tm-bump-row:last-child{border-bottom:none}
.tm-bump-lift{font-size:14px;color:var(--txm);font-family:system-ui,sans-serif;padding-top:2px}
.tm-bump-right{text-align:right}
.tm-bump-val{font-size:14px;font-weight:600;font-family:system-ui,sans-serif}
.tm-bump-val.upgrade{color:var(--ac)}
.tm-bump-reason{font-size:11px;color:var(--txd);font-family:system-ui,sans-serif;margin-top:2px}
.tm-bump-btns{display:flex;gap:8px;margin-top:14px}
.tm-bump-ok{flex:1;padding:13px;font-size:13px;font-family:system-ui,sans-serif;font-weight:600;background:var(--ac);color:var(--bg);border:none;border-radius:8px;cursor:pointer;letter-spacing:.3px}
.tm-bump-secondary{flex:1;padding:13px;font-size:13px;font-family:system-ui,sans-serif;background:var(--sf2);color:var(--txm);border:1px solid var(--bd);border-radius:8px;cursor:pointer}

/* Rest timer inline */
.rest-timer-row{display:flex;align-items:center;gap:8px;margin-top:8px}
.rest-timer-btn{padding:8px 14px;font-size:12px;font-family:system-ui,sans-serif;font-weight:600;background:var(--sf2);color:var(--ac);border:1px solid var(--acBd);border-radius:8px;cursor:pointer;letter-spacing:.5px;text-transform:uppercase}

/* Weekly summary */
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.summary-cell{background:var(--sf2);border-radius:10px;padding:12px;text-align:center;border:1px solid var(--bd)}
.summary-val{font-size:22px;font-weight:700;font-family:system-ui,sans-serif}
.summary-label{font-size:11px;color:var(--txm);font-family:system-ui,sans-serif;margin-top:4px}

/* Export */
.export-btn{width:100%;padding:12px;font-size:11px;font-family:system-ui,sans-serif;letter-spacing:1px;text-transform:uppercase;background:none;color:var(--ac);border:1px solid var(--acBd);border-radius:8px;cursor:pointer;margin-bottom:8px}
</style>
</head>
<body>

<div id="toast" class="toast"></div>
<div id="timer-root"></div>
<div id="app-today" class="page"></div>
<div id="app-progress" class="page hidden"></div>

<nav class="nav">
  <button class="nav-btn on" id="nav-today" onclick="switchView('today')">
    <span class="nav-icon">◉</span><span class="nav-txt">Today</span>
  </button>
  <button class="nav-btn" id="nav-progress" onclick="switchView('progress')">
    <span class="nav-icon">↗</span><span class="nav-txt">Progress</span>
  </button>
</nav>

<script>
const STORAGE_KEY="derek-531-v7";
const COACH_KEY="derek-531-coach-v3";
const round5=n=>Math.round(n/5)*5;
const esc=s=>{const d=document.createElement("div");d.textContent=s;return d.innerHTML};

const calcPlates=wt=>{let r=(wt-45)/2;if(r<=0)return"empty bar";const ps=[45,35,25,10,5,2.5],out=[];for(const p of ps){while(r>=p){out.push(p);r-=p}}return out.map(p=>p%1===0?p+"":p.toFixed(1)).join(" + ")+" each side"};

const WEEKS=[
  {label:"Week 1 — Building Volume",short:"Volume Week",why:'This week you\'re doing sets of 5 at moderate weight. The last set is "as many reps as possible" — push yourself but stop 1-2 reps before your form breaks down. This builds your base.',sets:[{pct:.65,reps:"5",amrap:false},{pct:.75,reps:"5",amrap:false},{pct:.85,reps:"5+",amrap:true}]},
  {label:"Week 2 — Building Intensity",short:"Intensity Week",why:'Heavier weight, fewer reps. You\'re training your nervous system to handle bigger loads. The last set is still "as many as possible" — the weight is heavier so you\'ll get fewer reps than last week. That\'s normal.',sets:[{pct:.70,reps:"3",amrap:false},{pct:.80,reps:"3",amrap:false},{pct:.90,reps:"3+",amrap:true}]},
  {label:"Week 3 — Peak Week",short:"Peak Week",why:"The heaviest week. You work up to 95% of your training max for a single rep — then keep going for as many as you can. This is where you prove you got stronger. Even 2-3 reps here is a win.",sets:[{pct:.75,reps:"5",amrap:false},{pct:.85,reps:"3",amrap:false},{pct:.95,reps:"1+",amrap:true}]},
  {label:"Week 4 — Recovery",short:"Deload",why:"Light weight, easy reps. This feels too easy — that's the point. Your muscles grow during recovery, not during the hard weeks. Don't skip this. After this week, your training weights go up and a new cycle starts.",sets:[{pct:.40,reps:"5",amrap:false},{pct:.50,reps:"5",amrap:false},{pct:.60,reps:"5",amrap:false}]}

// ═══════ STALL DETECTION ═══════
function getStallWarnings(){
  const warnings=[];
  LIFTS.forEach(l=>{
    const hist=data.history.filter(h=>h.lift===l.id&&h.amrapReps!=null);
    if(hist.length<1)return;
    const recent=hist.slice(-3);
    // Peak week decline
    const peakSets=recent.filter(h=>h.week===2);
    if(peakSets.length>=2){
      const declining=peakSets.every((h,i)=>i===0||h.amrapReps<=peakSets[i-1].amrapReps);
      const low=peakSets.some(h=>h.amrapReps<=2);
      if(declining&&low){
        const newTm=round5(data.maxes[l.id]*0.9);
        warnings.push({lift:l.id,title:l.title,type:"stall",msg:`<strong>${l.title}</strong> looks like it's stalling — barely hitting reps on peak week. Consider dropping TM from ${data.maxes[l.id]} to ${newTm} lb (10% reset).`});
      }
    }
    // Volume week too easy — threshold is 1 session (not 2) since early cycles only have one
    const volSets=recent.filter(h=>h.week===0);
    if(volSets.length>=1&&volSets[volSets.length-1].amrapReps>=10){
      warnings.push({lift:l.id,title:l.title,type:"too_easy",msg:`<strong>${l.title}</strong> is too easy — ${volSets[volSets.length-1].amrapReps} reps on your volume week AMRAP. Consider bumping TM from ${data.maxes[l.id]} to ${data.maxes[l.id]+l.inc*2} lb.`});
    }
    // Intensity week too easy
    const intSets=recent.filter(h=>h.week===1);
    if(intSets.length>=1&&intSets[intSets.length-1].amrapReps>=6){
      // Only warn if not already warned for volume week
      const alreadyWarned=warnings.some(w=>w.lift===l.id&&w.type==="too_easy");
      if(!alreadyWarned){
        warnings.push({lift:l.id,title:l.title,type:"too_easy",msg:`<strong>${l.title}</strong> — ${intSets[intSets.length-1].amrapReps} reps at 90% on intensity week. TM may be a bit low.`});
      }
    }
  });
  return warnings;
}

// ═══════ AMRAP FEEDBACK ═══════
function getAmrapFeedbackData(reps,weekIndex,lift){
  if(!reps||isNaN(reps)||reps<1)return null;
  const tm=data.maxes[lift.id];
  if(weekIndex===0){
    if(reps>=10)return{cls:"high",msg:`${reps} reps at 85% — TM is too conservative. Consider bumping from ${tm} → ${tm+lift.inc*2} lb next cycle.`};
    if(reps>=7)return{cls:"warn",msg:`${reps} reps — strong. TM goes up ${lift.inc} lb after deload. You're progressing.`};
    return{cls:"good",msg:`${reps} reps — right on target. TM goes up normally after deload.`};
  }
  if(weekIndex===1){
    if(reps>=6)return{cls:"high",msg:`${reps} reps at 90% — very strong. TM is likely too low. Consider ${tm} → ${tm+lift.inc*2} lb next cycle.`};
    if(reps>=4)return{cls:"warn",msg:`${reps} reps at 90% — solid. Standard +${lift.inc} lb after deload.`};
    return{cls:"good",msg:`${reps} reps at 90% — on track. TM goes up normally.`};
  }
  if(weekIndex===2){
    if(reps>=5)return{cls:"warn",msg:`${reps} reps at 95% — excellent. TM is slightly conservative; an extra bump next cycle is warranted.`};
    if(reps>=3)return{cls:"good",msg:`${reps} reps at 95% — solid. TM goes up normally.`};
    return{cls:"good",msg:`${reps===1?"1 rep":""+reps+" reps"} at 95% — that's heavy. TM is well calibrated.`};
  }
  return null;
}

function updateAmrapFeedback(){

// ═══════ RECOMMENDED TM BUMPS (post-deload) ═══════
function calcRecommendedTmBumps(){
  const recs={};
  LIFTS.forEach(l=>{
    const hist=data.history.filter(h=>h.lift===l.id&&h.amrapReps!=null);
    const lastVol=hist.filter(h=>h.week===0).slice(-1)[0];
    const lastInt=hist.filter(h=>h.week===1).slice(-1)[0];
    const lastPeak=hist.filter(h=>h.week===2).slice(-1)[0];
    let extraInc=0,reason=`standard +${l.inc} lb`;
    if(lastVol&&lastVol.amrapReps>=10){
      extraInc=l.inc;reason=`${lastVol.amrapReps} reps on volume week — TM was too conservative`;
    }else if(lastInt&&lastInt.amrapReps>=6){
      extraInc=l.inc;reason=`${lastInt.amrapReps} reps at 90% — strong intensity week`;
    }else if(lastPeak&&lastPeak.amrapReps>=5){
      extraInc=l.inc;reason=`${lastPeak.amrapReps} reps at 95% — excellent peak`;
    }
    recs[l.id]={from:data.maxes[l.id],standard:data.maxes[l.id]+l.inc,recommended:data.maxes[l.id]+l.inc+extraInc,reason};
  });
  return recs;
}

// ═══════ SKIP HELPERS ═══════
function getSessionSkips(working){
  const skips=[];
  const missedSets=working.length-session.doneSets.size;
  if(missedSets>0)skips.push(`${missedSets} working set${missedSets>1?"s":""}`);
  const missedAssist=2-Object.keys(session.picks).length;
  if(missedAssist>0)skips.push(`${missedAssist} assistance exercise${missedAssist>1?"s":""}`);
  if(!session.absDone)skips.push("ab finisher");
  return skips;
}

function formatSkipEntry(skipped){
  if(!skipped||!skipped.length)return"";
  return skipped.map(s=>{
    if(s.type==="working_sets")return`${s.total-s.completed} set${s.total-s.completed>1?"s":""}`;
    if(s.type==="assistance")return"assistance";
    if(s.type==="abs")return"abs";
    return s.type;
  }).join(", ");
}

// ═══════ DAYS SINCE ═══════
function getDaysSinceBanner(){
  if(!data.history.length)return"";
  const last=new Date(data.history[data.history.length-1].date);
  const days=Math.floor((new Date()-last)/(864e5));
  if(days<=1)return"";
  if(days>=7)return`<div class="gap-banner warn"><strong>${days} days since your last workout.</strong> Consider repeating this week instead of advancing.</div>`;
  if(days>=3)return`<div class="gap-banner">${days} days since your last workout. Time to get back in.</div>`;
  return"";
}

// ═══════ WEEKLY SUMMARY ═══════
function getWeeklySummary(){
  const now=new Date();
  const weekAgo=new Date(now-7*864e5);
  const thisWeek=data.history.filter(h=>new Date(h.date)>=weekAgo);
  if(thisWeek.length===0)return null;
  const workouts=thisWeek.length;
  const bestAmrap=thisWeek.filter(h=>h.amrapReps).sort((a,b)=>(b.topSet*b.amrapReps)-(a.topSet*a.amrapReps))[0];
  const bwThisWeek=data.bwLog.filter(b=>new Date(b.date)>=weekAgo);
  const avgBw=bwThisWeek.length?Math.round(bwThisWeek.reduce((s,b)=>s+b.wt,0)/bwThisWeek.length*10)/10:null;
  return{workouts,bestAmrap,avgBw};
}

  try{
    const response=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:prompt}]})});

    </header>

    ${getDaysSinceBanner()}
    ${stalls.map(s=>`<div class="stall-banner">${s.msg}<br><span class="update-tm-link" onclick="switchView('progress')">Update training max →</span></div>`).join("")}

    <section class="card">
      <div class="card-head" onclick="toggleWeekInfo()">
        <h2 class="card-title">📋 What's this week about?</h2>
        <button class="toggle">${session.showWeekInfo?"−":"+"}</button>
      </div>
      ${session.showWeekInfo?`<div class="info-box">${esc(wk.why)}</div>`:`<p class="preview">${esc(wk.label)}</p>`}
    </section>

    <section class="card">
      <div class="card-head"${session.warmDone?' onclick="toggleWarmup()" style="cursor:pointer"':""}>
        <h2 class="card-title">🏃 Warmup</h2>
        <div class="chk${session.warmDone?" on":""}">${session.warmDone?"✓":""}</div>
      </div>
      ${session.warmDone
        ?`<p class="desc" style="margin-top:8px;margin-bottom:0">Done — tap checkmark to undo.</p>`
        :`<p class="desc">Run a mile, then hit the empty bar for 10 reps. That's it.</p>
          <div class="warmup-quick">
            <button class="warmup-quick-btn${session.warmMode==="quick"?" done":""}" onclick="setWarmMode('quick')">✓ Ran + empty bar</button>
            <button class="warmup-quick-btn${session.warmMode==="full"?" active-opt":""}" onclick="setWarmMode('full')">${session.warmMode==="full"?"▾ Hide sets":"▸ Full warmup sets"}</button>
          </div>
          ${session.warmMode==="full"?`
            <p class="desc" style="margin-top:12px;margin-bottom:8px">Light sets to groove the movement before going heavy.</p>
            <div class="warm-grid">
              ${warmup.map((s,i)=>`<div class="warm-cell${session.doneWarm.has(i)?" done":""}" onclick="toggleWarmSet(${i})">
                <div class="warm-wt">${s.wt}<span class="lb">lb</span></div>
                <div class="warm-reps">× ${s.reps}</div>
                <div class="plate-text">${esc(calcPlates(s.wt))}</div>
                ${session.doneWarm.has(i)?'<div class="mini-chk">✓</div>':""}
              </div>`).join("")}
            </div>
          `:""}
          <div class="mob-toggle" onclick="toggleMobility()">
            <span class="mob-txt">${session.mobOpen?"Hide":"Optional: 3 min mobility"}</span>
            <button class="toggle">${session.mobOpen?"−":"+"}</button>
          </div>
          ${session.mobOpen?`<div class="mob-list">${MOBILITY.map(m=>`<div class="mob-item">${esc(m)}</div>`).join("")}</div>`:""}`
      }
    </section>

    <section class="card">
      <h2 class="card-title">⚡ Working Sets</h2>
      <p class="desc">The sets that count. Tap each one when done.</p>
      <div class="work-list">
        ${working.map((s,i)=>`<div class="work-row${s.amrap?" gold":""}${session.doneSets.has(i)?" done":""}" onclick="toggleWorkSet(${i})">
          <div class="work-left">
            <div class="work-label">Set ${i+1}${s.amrap?" — push it":""}</div>
            <div class="work-wt">${s.wt}<span class="lb">lb</span></div>
            <div class="plate-text">${esc(calcPlates(s.wt))}</div>
          </div>
          <div class="work-right">
            <div class="work-reps${s.amrap?" gold-text":""}">${s.amrap?s.reps+" (max)":"× "+s.reps}</div>
            <div class="work-pct">${s.pct}%</div>
          </div>
          ${session.doneSets.has(i)?'<div class="big-chk">✓</div>':""}
        </div>`).join("")}
      </div>
      ${working.some(s=>s.amrap)?`
      <div class="gold-box">
        <label class="lbl">How many reps on the last set?</label>
        <p class="hint">More reps at the same weight over time = getting stronger.</p>
        <input class="inp" type="number" inputmode="numeric" placeholder="e.g. 8" id="amrap-input" value="${esc(amrapVal)}" oninput="updateAmrapFeedback()">
        <div id="amrap-feedback" class="amrap-feedback${amrapFb?" "+amrapFb.cls:""}">${amrapFb?amrapFb.msg:""}</div>
      </div>`:""}
      <div class="rest-box">
        <strong>Rest:</strong> 3–5 minutes between these sets.
        <div class="rest-timer-row">
          <button class="rest-timer-btn" onclick="startTimer(180,'Working set rest')">3:00</button>
          <button class="rest-timer-btn" onclick="startTimer(300,'Working set rest')">5:00</button>
        </div>
      </div>
    </section>

    <section class="card">
      <h2 class="card-title">🔧 Supporting Exercises — Pick 2</h2>
      <p class="desc">Pick whichever two sound good. Rotate week to week. Tap name to learn it.</p>
      <div class="assist-list">
        ${lift.assist.map((a,i)=>{
          const sel=session.picks[i]!==undefined;const locked=pickCount>=2&&!sel;const expanded=session.expandedEx===a.name;
          return`<div>
            <div class="assist-row${sel?" sel":""}${locked?" locked":""}" onclick="togglePick(${i},'${esc(a.name)}')">
              <div class="assist-info">
                <span class="assist-name${expanded?" expanded":""}" onclick="event.stopPropagation();toggleExInfo('${esc(a.name)}')">${esc(a.name)}</span>
                <div class="assist-meta">${a.sets} sets × ${a.reps}</div>
              </div>
              ${sel?'<div class="badge">selected</div>':(!locked?'<div class="tap-hint">tap</div>':"")}
            </div>
            ${expanded&&EX_INFO[a.name]?`<div class="ex-info">${esc(EX_INFO[a.name])}</div>`:""}
          </div>`;
        }).join("")}
      </div>
      <div class="rest-box">
        <strong>Rest:</strong> 1–2 minutes between sets.
        <div class="rest-timer-row">
          <button class="rest-timer-btn" onclick="startTimer(60,'Assistance rest')">1:00</button>
          <button class="rest-timer-btn" onclick="startTimer(120,'Assistance rest')">2:00</button>
        </div>
      </div>
    </section>

    <section class="card" style="cursor:pointer" onclick="toggleAbs()">
      <div class="card-head">
        <h2 class="card-title">🎯 Ab Finisher</h2>
        <div class="chk${session.absDone?" on":""}">${session.absDone?"✓":""}</div>
      </div>
      <div style="margin-top:8px">
        <span class="abs-name${session.expandedEx===lift.abs.name?" expanded":""}" onclick="event.stopPropagation();toggleExInfo('${esc(lift.abs.name)}')">${esc(lift.abs.name)}</span>
        ${session.expandedEx===lift.abs.name&&EX_INFO[lift.abs.name]?`<div class="ex-info">${esc(EX_INFO[lift.abs.name])}</div>`:""}
        <div class="abs-reps">${lift.abs.sets} sets × ${lift.abs.reps}</div>
      </div>
      <div class="rest-box" onclick="event.stopPropagation()">
        <strong>Rest:</strong> 60 seconds.
        <div class="rest-timer-row">
          <button class="rest-timer-btn" onclick="event.stopPropagation();startTimer(60,'Ab rest')">1:00</button>
        </div>
      </div>
    </section>

    <section class="card">
      <label class="lbl">How did it feel?</label>
      <p class="hint">Write anything. This feeds the coach on your Progress page.</p>
      <textarea class="ta" rows="3" placeholder='e.g. "Felt strong. Had 2 more in me."' id="notes-input">${esc(notesVal)}</textarea>
      <div style="margin-top:16px">
        <label class="lbl">Bodyweight? (optional)</label>
        <input class="inp" type="number" inputmode="decimal" placeholder="e.g. 182" id="bw-input" value="${esc(bwVal)}">
      </div>
      <button class="btn${canSubmit?"":" off"}" onclick="${canSubmit?"requestSubmit()":""}" ${canSubmit?"":"disabled"}>
        ${submitLabel}
      </button>
      ${session.pendingSubmit?`
      <div class="skip-confirm">
        <div class="skip-confirm-msg">Logging this workout with skips: <strong>${session.pendingSkips.join(", ")}</strong>. Continue?</div>
        <div class="skip-confirm-btns">
          <button class="skip-confirm-ok" onclick="finishWorkout()">Log it</button>
          <button class="skip-confirm-cancel" onclick="cancelSubmit()">Back</button>
        </div>
      </div>`:""}
    </section>`;

  if(liftHist.length>0){
    html+=`<section class="card"><h2 class="card-title">📈 ${esc(lift.title)} Progress</h2>`;
    html+=liftHist.slice(-6).map(h=>`<div class="hist-entry"><div class="hist-row"><span class="hist-date">${new Date(h.date).toLocaleDateString("en-US",{month:"short",day:"numeric"})}</span><span class="hist-detail">${h.topSet} lb × ${h.amrapReps}</span></div>${h.notes?`<div class="hist-note">"${esc(h.notes)}"</div>`:""}</div>`).join("");
    html+=`</section>`;
  }
  html+=`<div class="time-note">~55 min session</div>`;
  document.getElementById("app-today").innerHTML=html;
}

// ═══════ RENDER PROGRESS ═══════
function renderProgress(){
  const wk=WEEKS[data.week];
  const summary=getWeeklySummary();
  const stalls=getStallWarnings();

  let html=`<h1>Progress</h1>

    <section class="card">
      <h2 class="card-title">🧠 Coach Insights</h2>
      <div id="coach-content"></div>
    </section>`;

  if(summary){
    html+=`<section class="card">
      <h2 class="card-title">📊 This Week</h2>
      <div class="summary-grid">
        <div class="summary-cell"><div class="summary-val">${summary.workouts}/4</div><div class="summary-label">Workouts</div></div>
        <div class="summary-cell"><div class="summary-val">${summary.avgBw||"—"}</div><div class="summary-label">Avg BW (lb)</div></div>
      </div>
      ${summary.bestAmrap?`<p class="desc" style="margin-top:10px">Best AMRAP: ${LIFTS.find(l=>l.id===summary.bestAmrap.lift)?.title} at ${summary.bestAmrap.topSet}lb × ${summary.bestAmrap.amrapReps}</p>`:""}
    </section>`;
  }

  if(stalls.length>0){
    html+=`<section class="card"><h2 class="card-title">⚠️ Attention</h2>`;
    stalls.forEach(s=>{html+=`<div class="stall-banner" style="margin-top:8px">${s.msg}</div>`});
    html+=`</section>`;
  }

  html+=`<section class="card">
      <h2 class="card-title">🗺 Cycle Roadmap</h2>
      <p class="desc">4 weeks per cycle. After recovery, training maxes go up automatically.</p>
      <div class="roadmap">
        ${WEEKS.map((w,i)=>`<div class="rm-item${i===data.week?" active":""}">
          <div class="rm-dot">${i<data.week?"✓":i===data.week?"●":"○"}</div>
          <div><div class="rm-label${i===data.week?" gold-text":""}">${esc(w.short)}</div><div class="rm-sub">${i===data.week?`Day ${data.day+1}/4`:i<data.week?"Done":"Coming up"}</div></div>
        </div>`).join("")}
      </div>
      <div class="rm-note">Cycle ${data.cycle}</div>
      ${data.week===3?`<button class="rest-timer-btn" style="margin-top:10px;width:100%;text-align:center" onclick="skipDeload()">Skip deload → start next cycle</button>`:""}
    </section>

    <section class="card">
      <h2 class="card-title">🔄 Workout Order</h2>
      ${LIFTS.map((l,i)=>`<div class="order-row${i===data.day?" active":""}">
        <span class="order-num">${i+1}</span><span${i===data.day?' class="gold-text"':""}>${esc(l.title)}</span>
        ${i===data.day?'<span class="badge" style="margin-left:auto">next</span>':""}
      </div>`).join("")}
    </section>

    <section class="card">
      <div class="card-head">
        <h2 class="card-title">🏋️ Training Maxes</h2>
        <button class="edit-btn" onclick="toggleEditMaxes()">Edit</button>
      </div>
      <p class="desc">All working weights come from these. They increase automatically each cycle.</p>
      <div class="max-grid" id="maxes-grid">
        ${LIFTS.map(l=>`<div class="max-cell"><div class="max-label">${esc(l.title)}</div><div class="max-val">${data.maxes[l.id]}<span class="lb"> lb</span></div><div class="max-inc">+${l.inc}/cycle</div></div>`).join("")}
      </div>
      <div id="maxes-edit"></div>
    </section>`;

  if(data.bwLog.length>0){
    html+=`<section class="card"><h2 class="card-title">⚖️ Bodyweight</h2><p class="desc">Trending toward 190 lean.</p><div class="bw-scroll">
      ${data.bwLog.slice(-10).map(b=>`<div class="bw-cell"><div class="bw-date">${new Date(b.date).toLocaleDateString("en-US",{month:"short",day:"numeric"})}</div><div class="bw-val">${b.wt}</div></div>`).join("")}
    </div></section>`;
  }

  html+=`<section class="card"><h2 class="card-title">📖 Workout Log</h2>`;
  if(!data.history.length)html+=`<p class="desc">Nothing logged yet.</p>`;
  else html+=data.history.slice(-20).reverse().map(h=>{
    const l=LIFTS.find(x=>x.id===h.lift);
    const skipStr=formatSkipEntry(h.skipped);
    return`<div class="hist-entry">
      <div class="hist-row">
        <span class="hist-date">${new Date(h.date).toLocaleDateString("en-US",{month:"short",day:"numeric"})}</span>
        <span class="hist-lift">${l?.title||""}</span>
        <span class="hist-detail">${h.topSet}lb${h.amrapReps!=null?` × ${h.amrapReps}`:""}</span>
      </div>
      ${h.notes?`<div class="hist-note">"${esc(h.notes)}"</div>`:""}
      ${skipStr?`<div class="hist-skip">skipped: ${esc(skipStr)}</div>`:""}
    </div>`;
  }).join("");
  html+=`</section>`;

  html+=`<section class="card">
    <button class="export-btn" onclick="exportData()">Export Data (JSON Backup)</button>
    <button class="reset-btn" onclick="resetAll()">Reset All Data</button>
  </section>`;

  document.getElementById("app-progress").innerHTML=html;
  renderCoachSection();
}

// ═══════ ACTIONS ═══════
function toggleLiftInfo(){session.showLiftInfo=!session.showLiftInfo;renderToday()}
function toggleWeekInfo(){session.showWeekInfo=!session.showWeekInfo;renderToday()}
function toggleWarmup(){
  session.warmDone=!session.warmDone;
  if(!session.warmDone){session.warmMode=null;session.doneWarm=new Set()}
  renderToday();
}
function toggleMobility(){session.mobOpen=!session.mobOpen;renderToday()}
function toggleAbs(){session.absDone=!session.absDone;renderToday()}
function toggleWarmSet(i){
  session.doneWarm.has(i)?session.doneWarm.delete(i):session.doneWarm.add(i);
  if(session.doneWarm.size>=3)session.warmDone=true;
  renderToday();
}
function setWarmMode(mode){
  if(mode==="quick"){session.warmMode="quick";session.warmDone=true}
  else{session.warmMode=session.warmMode==="full"?null:"full"}
  renderToday();
}
function toggleWorkSet(i){session.doneSets.has(i)?session.doneSets.delete(i):session.doneSets.add(i);renderToday()}
function toggleExInfo(n){session.expandedEx=session.expandedEx===n?null:n;renderToday()}
function togglePick(i,n){const c=Object.keys(session.picks).length;if(session.picks[i]!==undefined)delete session.picks[i];else if(c<2)session.picks[i]=n;renderToday()}

function requestSubmit(){
  const lift=LIFTS[data.day],wk=WEEKS[data.week],tm=data.maxes[lift.id];
  const working=wk.sets.map(s=>({wt:round5(tm*s.pct)}));
  const skips=getSessionSkips(working);
  if(skips.length===0){finishWorkout();return}
  session.pendingSubmit=true;session.pendingSkips=skips;
  renderToday();
  // Scroll to bottom so confirm panel is visible
  setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"}),50);
}

function cancelSubmit(){session.pendingSubmit=false;session.pendingSkips=[];renderToday()}

function finishWorkout(){
  const lift=LIFTS[data.day],wk=WEEKS[data.week],tm=data.maxes[lift.id];
  const working=wk.sets.map(s=>({wt:round5(tm*s.pct)}));
  const amrapVal=document.getElementById("amrap-input")?.value;
  const bwVal=document.getElementById("bw-input")?.value;
  const notesVal=document.getElementById("notes-input")?.value;

  // Compute skips for the log entry
  const skipped=[];
  const missedSets=working.length-session.doneSets.size;
  if(missedSets>0)skipped.push({type:"working_sets",completed:session.doneSets.size,total:working.length});
  if(Object.keys(session.picks).length<2)skipped.push({type:"assistance",completed:Object.keys(session.picks).length,total:2});
  if(!session.absDone)skipped.push({type:"abs"});

  // Check if this workout completes a full cycle (deload week, last day)
  const willFinishCycle=(data.day===3&&data.week===3);
  let recs=null;
  if(willFinishCycle)recs=calcRecommendedTmBumps();

  let nDay=data.day+1,nWeek=data.week,nCycle=data.cycle,nMaxes={...data.maxes};
  if(nDay>=4){nDay=0;nWeek++;if(nWeek>=4){nWeek=0;nCycle++;LIFTS.forEach(l=>{nMaxes[l.id]+=l.inc})}}

  const entry={
    date:new Date().toISOString(),cycle:data.cycle,week:data.week,day:data.day,lift:lift.id,
    amrapReps:amrapVal?parseInt(amrapVal):null,topSet:working[working.length-1].wt,
    assists:Object.values(session.picks),bw:bwVal?parseFloat(bwVal):null,
    notes:notesVal?.trim()||null,
    skipped:skipped.length>0?skipped:null
  };

  if(bwVal)data.bwLog.push({date:new Date().toISOString(),wt:parseFloat(bwVal)});
  data.history.push(entry);data.day=nDay;data.week=nWeek;data.cycle=nCycle;data.maxes=nMaxes;
  saveData();

  if(recs){
    resetSession();
    session.justFinishedCycle=true;session.cycleRecs=recs;session.appliedMaxes=nMaxes;
    flash("Cycle complete!");
  }else{
    resetSession();
    flash("Workout logged ✓");
  }
  renderToday();
}

function skipDeload(){
  if(!confirm("Skip the deload week and start the next cycle? Your training maxes will go up now."))return;
  data.week=0;data.day=0;data.cycle++;
  LIFTS.forEach(l=>{data.maxes[l.id]+=l.inc});
  saveData();flash("New cycle started");renderProgress();
}

let editingMaxes=false;
function toggleEditMaxes(){
  editingMaxes=!editingMaxes;
  if(editingMaxes){
    document.getElementById("maxes-grid").innerHTML=LIFTS.map(l=>`<div class="max-cell"><div class="max-label">${esc(l.title)}</div><input class="max-input" type="number" inputmode="numeric" id="max-${l.id}" value="${data.maxes[l.id]}"><div class="max-inc">+${l.inc}/cycle</div></div>`).join("");
    document.getElementById("maxes-edit").innerHTML=`<button class="btn" onclick="saveMaxes()">Save</button>`;
  }else renderProgress();
}

function saveMaxes(){
  LIFTS.forEach(l=>{const v=document.getElementById(`max-${l.id}`)?.value;if(v)data.maxes[l.id]=parseInt(v)||data.maxes[l.id]});
  saveData();editingMaxes=false;lastCoachHistLen=0;flash("Updated");renderProgress();maybeLoadCoach();
}

function resetAll(){
  if(!confirm("Erase everything — all history, maxes, notes? Can't be undone."))return;
  data={maxes:{...DEFAULT_MAXES},cycle:1,week:0,day:0,history:[],bwLog:[]};
  saveData();try{localStorage.removeItem(COACH_KEY)}catch{}
  coachMsg="";lastCoachHistLen=0;resetSession();flash("Reset complete");renderProgress();
}

// ═══════ INIT ═══════
loadData();renderToday();
</script>
</body>
</html>
