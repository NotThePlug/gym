<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="531">
<meta name="theme-color" content="#FDFCFA">
<title>531 Tracker</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180.png">
<link rel="apple-touch-icon" sizes="512x512" href="apple-touch-icon.png">
<link rel="icon" sizes="512x512" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FDFCFA;--surface:#FFFFFF;--surface2:#F6F4F0;
  --border:#ECEAE5;--border2:#E1DDD5;
  --tx:#2B2B2B;--txm:#7A756E;--txd:#AAA49B;
  --coral:#FF7A59;--violet:#7C5CFC;
  --grad:linear-gradient(135deg,#FF7A59 0%,#7C5CFC 100%);
  --good:#3FA56A;--goodBg:#EEF8F1;
  --warn:#E08A2B;--warnBg:#FDF3E7;
  --push:#7C5CFC;--pushBg:#F1EEFE;
  --sh1:0 1px 2px rgba(43,32,8,.04);
  --sh2:0 6px 24px rgba(43,32,8,.06);
}
html{background:var(--bg);color:var(--tx);font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}
body{max-width:480px;margin:0 auto;padding-bottom:96px;min-height:100vh;min-height:100dvh}
input,textarea,button{font-family:inherit;color:inherit}
.page{padding:22px 18px;padding-top:calc(20px + env(safe-area-inset-top))}
.hidden{display:none}

/* Header */
.header{margin-bottom:18px}
.eyebrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.pill{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:5px 11px;border-radius:999px;background:var(--pushBg);color:var(--violet)}
.pill-dim{font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--txd)}
h1{font-size:32px;font-weight:800;letter-spacing:-1px;margin:0 0 2px}
.h1-grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.subhead{font-size:15px;color:var(--txm);margin-top:6px;line-height:1.5}
.tmline{display:flex;align-items:baseline;gap:8px;margin-top:12px;flex-wrap:wrap}
.tm-big{font-size:15px;color:var(--tx);font-weight:600}
.tm-hist{font-size:13px;color:var(--txd)}

/* Cards */
.card{background:var(--surface);border-radius:20px;padding:18px;border:1px solid var(--border);margin-bottom:14px;box-shadow:var(--sh1)}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card-title{font-size:15px;font-weight:700;letter-spacing:-.2px;margin:0;display:flex;align-items:center;gap:8px}
.card-emoji{font-size:17px}
.card-sub{font-size:13.5px;color:var(--txm);margin:6px 0 0;line-height:1.55}

/* Check pill */
.check{width:30px;height:30px;border-radius:10px;border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;flex-shrink:0;cursor:pointer;transition:.15s}
.check.on{background:var(--grad);border-color:transparent}

/* Run card */
.run-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.run-meta{font-size:13px;color:var(--txd);margin-top:7px;font-variant-numeric:tabular-nums}

/* Working sets */
.prep{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 4px;padding:11px 14px;background:var(--surface2);border-radius:12px}
.prep-txt{font-size:13.5px;color:var(--txm)}
.prep-txt b{color:var(--tx);font-weight:600}
.sets{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 16px;background:var(--surface2);border-radius:14px;border:1px solid transparent;cursor:pointer;position:relative;transition:.15s}
.set.final{background:var(--pushBg);border-color:#E4DEFB}
.set.done{opacity:.5}
.set-l{flex:1}
.set-tag{font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--txd);margin-bottom:3px}
.set.final .set-tag{color:var(--violet)}
.set-wt{font-size:27px;font-weight:800;letter-spacing:-1px}
.lb{font-size:13px;font-weight:600;color:var(--txm);margin-left:2px}
.set-plate{font-size:11.5px;color:var(--txd);margin-top:3px}
.set-r{text-align:right;flex-shrink:0}
.set-reps{font-size:17px;font-weight:700}
.set.final .set-reps{color:var(--violet)}
.set-pct{font-size:12px;color:var(--txd);font-weight:500}
.set-chk{font-size:19px;color:var(--good);margin-left:4px;width:20px}

/* Final reps input */
.final-box{margin-top:14px;padding:15px;background:var(--pushBg);border-radius:14px;border:1px solid #E4DEFB}
.fb-label{font-size:14px;font-weight:600;color:var(--violet);display:block;margin-bottom:3px}
.fb-hint{font-size:12.5px;color:var(--txm);margin:0 0 10px;line-height:1.5}
.inp{width:100%;padding:13px 14px;font-size:19px;font-weight:700;background:var(--surface);border:1.5px solid var(--border2);border-radius:11px;outline:none}
.inp:focus{border-color:var(--violet)}
.projection{font-size:13px;margin-top:11px;padding:11px 13px;border-radius:11px;line-height:1.5;font-weight:500}
.projection.good{background:var(--goodBg);color:#2E7D4F}
.projection.push{background:#EDE9FE;color:#5B43D6}
.projection.warn{background:var(--warnBg);color:#B5701F}

.rest-note{font-size:13px;color:var(--txd);margin-top:13px;text-align:center}

/* Abs block */
.abs-list{display:flex;flex-direction:column;gap:9px;margin-top:13px}
.abs-item{padding:13px 15px;background:var(--surface2);border-radius:13px}
.abs-top{display:flex;align-items:center;gap:10px}
.abs-slot{font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--violet);background:var(--pushBg);padding:3px 8px;border-radius:999px}
.abs-name{font-size:15px;font-weight:600}
.abs-meta{font-size:12.5px;color:var(--txm);margin-top:5px}
.abs-how{font-size:12.5px;color:var(--txd);margin-top:5px;line-height:1.5}

/* Supporting */
.sup-head{display:flex;justify-content:space-between;align-items:center}
.sup-count{font-size:12px;font-weight:700;color:var(--violet)}
.sup-list{display:flex;flex-direction:column;gap:9px;margin-top:13px}
.sup-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;background:var(--surface2);border-radius:13px;border:1.5px solid transparent;cursor:pointer;transition:.15s}
.sup-row.sel{border-color:var(--violet);background:var(--pushBg)}
.sup-row.locked{opacity:.4;cursor:default}
.sup-info{flex:1}
.sup-name{font-size:15px;font-weight:600;cursor:pointer}
.sup-name u{text-decoration:none;border-bottom:1.5px dotted var(--txd)}
.sup-detail{font-size:12.5px;color:var(--txm);margin-top:3px}
.sup-how{font-size:12.5px;color:var(--txd);margin-top:8px;line-height:1.5;padding:9px 11px;background:var(--surface);border-radius:9px}
.sup-badge{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#fff;background:var(--grad);padding:4px 9px;border-radius:999px;flex-shrink:0}
.sup-tap{font-size:11px;color:var(--txd);flex-shrink:0}
.sup-swap{font-size:12px;color:var(--violet);font-weight:600;cursor:pointer;margin-top:10px;display:inline-block;border-bottom:1px dotted var(--violet)}

/* Buttons */
.btn{width:100%;padding:16px;font-size:15px;font-weight:700;letter-spacing:.2px;background:var(--grad);color:#fff;border:none;border-radius:14px;cursor:pointer;margin-top:6px;box-shadow:0 4px 14px rgba(124,92,252,.25)}
.btn.off{background:var(--surface2);color:var(--txd);box-shadow:none;cursor:default}
.btn-ghost{width:100%;padding:13px;font-size:13px;font-weight:600;background:var(--surface);color:var(--violet);border:1.5px solid #E4DEFB;border-radius:12px;cursor:pointer}

/* Skip confirm */
.skip-confirm{margin-top:13px;padding:15px;background:var(--warnBg);border:1px solid #F3DEC0;border-radius:14px}
.skip-msg{font-size:13.5px;color:#915B16;margin-bottom:12px;line-height:1.5}
.skip-btns{display:flex;gap:9px}
.skip-ok{flex:1;padding:13px;font-size:14px;font-weight:700;background:var(--grad);color:#fff;border:none;border-radius:11px;cursor:pointer}
.skip-cancel{flex:1;padding:13px;font-size:14px;font-weight:600;background:var(--surface);color:var(--txm);border:1px solid var(--border2);border-radius:11px;cursor:pointer}

/* Banners */
.banner{font-size:13.5px;padding:13px 15px;border-radius:14px;margin-bottom:14px;line-height:1.5}
.banner.gap{background:var(--surface);border:1px solid var(--border);color:var(--txm)}
.banner.warn{background:var(--warnBg);border:1px solid #F3DEC0;color:#915B16}
.banner b{font-weight:700}
.banner .ilink{color:var(--violet);font-weight:600;cursor:pointer;border-bottom:1px dotted var(--violet)}

/* Coach insights */
.insight{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
.insight:last-child{border-bottom:none;padding-bottom:0}
.insight:first-child{padding-top:4px}
.ins-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:6px}
.ins-dot.good{background:var(--good)}
.ins-dot.warn{background:var(--warn)}
.ins-dot.push{background:var(--push)}
.ins-text{font-size:13.5px;line-height:1.55;color:var(--tx)}
.ins-text b{font-weight:700}

/* Strength trend */
.trend-row{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--border)}
.trend-row:last-child{border-bottom:none}
.trend-name{font-size:14px;font-weight:600;width:92px;flex-shrink:0}
.spark{flex:1;height:34px}
.trend-val{text-align:right;flex-shrink:0;min-width:62px}
.trend-now{font-size:16px;font-weight:800}
.trend-delta{font-size:12px;font-weight:600}
.trend-delta.up{color:var(--good)}
.trend-delta.flat{color:var(--txd)}
.trend-delta.down{color:var(--warn)}

/* Diagnostics */
.diag-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:13px}
.diag-cell{background:var(--surface2);border-radius:13px;padding:13px 8px;text-align:center}
.diag-val{font-size:23px;font-weight:800;letter-spacing:-.5px}
.diag-val.warnv{color:var(--warn)}
.diag-label{font-size:11px;color:var(--txm);margin-top:3px;line-height:1.3}

/* Roadmap */
.rm{display:flex;flex-direction:column;margin-top:6px}
.rm-item{display:flex;align-items:center;gap:13px;padding:9px 0;padding-left:18px;border-left:2px solid var(--border);margin-left:7px;position:relative}
.rm-item.active{border-left-color:var(--violet)}
.rm-item.done{border-left-color:var(--good)}
.rm-dot{position:absolute;left:-7px;width:13px;height:13px;border-radius:50%;background:var(--surface);border:2px solid var(--border2)}
.rm-item.active .rm-dot{border-color:var(--violet);background:var(--violet)}
.rm-item.done .rm-dot{border-color:var(--good);background:var(--good)}
.rm-label{font-size:14px;font-weight:600}
.rm-label.active{color:var(--violet)}
.rm-sub{font-size:12px;color:var(--txd)}
.rm-order{display:flex;gap:7px;margin-top:14px;flex-wrap:wrap}
.rm-chip{font-size:12px;font-weight:600;padding:6px 11px;border-radius:999px;background:var(--surface2);color:var(--txm)}
.rm-chip.now{background:var(--grad);color:#fff}

/* Maxes */
.max-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}
.max-cell{background:var(--surface2);border-radius:14px;padding:15px;text-align:center}
.max-label{font-size:12.5px;color:var(--txm);margin-bottom:5px}
.max-val{font-size:25px;font-weight:800;letter-spacing:-.5px}
.max-inc{font-size:11px;color:var(--txd);margin-top:3px}
.max-input{width:85%;padding:9px;font-size:21px;font-weight:800;background:var(--surface);border:1.5px solid var(--border2);border-radius:9px;text-align:center;outline:none}
.tucked{font-size:12px;color:var(--txd);text-align:center;margin-top:12px}
.tucked u{cursor:pointer;color:var(--violet);text-decoration:none;border-bottom:1px dotted var(--violet)}

/* BW */
.bw-scroll{display:flex;gap:14px;overflow-x:auto;padding:12px 2px 4px;margin-top:6px}
.bw-cell{text-align:center;flex-shrink:0}
.bw-date{font-size:10.5px;color:var(--txd)}
.bw-val{font-size:19px;font-weight:700;margin-top:2px}
.bw-add{display:flex;gap:9px;margin-top:10px}
.bw-add input{flex:1;padding:11px;font-size:15px;font-weight:600;background:var(--surface2);border:1px solid var(--border);border-radius:11px;outline:none}
.bw-add button{padding:11px 18px;font-size:13px;font-weight:700;background:var(--surface2);color:var(--violet);border:1px solid #E4DEFB;border-radius:11px;cursor:pointer}

/* Recent sessions */
.log-toggle{font-size:13px;font-weight:600;color:var(--violet);cursor:pointer;margin-top:6px;display:inline-block}
.log-entry{padding:11px 0;border-bottom:1px solid var(--border)}
.log-entry:last-child{border-bottom:none}
.log-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.log-date{font-size:12px;color:var(--txd);min-width:48px}
.log-lift{font-size:14px;font-weight:600;flex:1}
.log-detail{font-size:13.5px;font-weight:700}
.log-skip{font-size:11.5px;color:var(--warn);margin-top:4px}

/* Cycle complete */
.cc-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
.cc-row:last-child{border-bottom:none}
.cc-lift{font-size:14px;font-weight:600;padding-top:2px}
.cc-right{text-align:right}
.cc-val{font-size:15px;font-weight:800}
.cc-val.up{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.cc-reason{font-size:11.5px;color:var(--txd);margin-top:3px}
.cc-std{font-size:11px;color:var(--txd);margin-top:2px}

/* Toast */
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--tx);color:#fff;padding:11px 22px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:400;opacity:0;transition:opacity .3s;box-shadow:var(--sh2);pointer-events:none}
.toast.show{opacity:1}

/* Rest timer (optional) */
.rest-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:13px;flex-wrap:wrap}
.rest-label{font-size:13px;color:var(--txd)}
.timer-chip{padding:8px 16px;font-size:13px;font-weight:700;background:var(--surface2);color:var(--violet);border:1px solid #E4DEFB;border-radius:999px;cursor:pointer}
.timer-chip:active{background:var(--pushBg)}
body.timer-running{padding-bottom:168px}
.timer-bar{position:fixed;bottom:calc(64px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:452px;background:var(--surface);border:1px solid var(--border);border-radius:16px;display:flex;align-items:center;gap:12px;padding:12px 16px;z-index:200;box-shadow:var(--sh2)}
.timer-bar-time{font-size:25px;font-weight:800;font-variant-numeric:tabular-nums;min-width:58px;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.timer-bar-label{flex:1;font-size:13px;color:var(--txm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer-bar-done{flex:1;font-size:13.5px;font-weight:700;color:var(--good)}
.timer-bar-x{font-size:16px;color:var(--txd);background:none;border:none;cursor:pointer;padding:4px 6px;line-height:1}

/* Nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:rgba(253,252,250,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--border);z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;padding:13px 0 11px;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--txd)}
.nav-btn.on{color:var(--violet)}
.nav-icon{font-size:19px}
.nav-txt{font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.foot-note{text-align:center;font-size:12px;color:var(--txd);padding:14px 0 4px}
</style>
</head>
<body>

<div id="toast" class="toast"></div>
<div id="timer-root"></div>
<div id="app-today" class="page"></div>
<div id="app-progress" class="page hidden"></div>

<nav class="nav">
  <button class="nav-btn on" id="nav-today" onclick="switchView('today')">
    <span class="nav-icon">◉</span><span class="nav-txt">Today</span>
  </button>
  <button class="nav-btn" id="nav-progress" onclick="switchView('progress')">
    <span class="nav-icon">↗</span><span class="nav-txt">Progress</span>
  </button>
</nav>

<script>
/* ════════════════════════ CONFIG ════════════════════════ */
const STORAGE_KEY="derek-531-v8";
const SESSION_KEY="derek-531-session-v8";
const OLD_KEY="derek-531-v7";
const round5=n=>Math.round(n/5)*5;
const esc=s=>{const d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML};
const epley=(w,r)=>Math.round(w*(1+r/30));

const calcPlates=wt=>{let r=(wt-45)/2;if(r<=0)return"just the bar";const ps=[45,35,25,10,5,2.5],out=[];for(const p of ps){while(r>=p){out.push(p);r-=p}}if(!out.length)return"just the bar";return out.map(p=>p%1===0?p+"":p.toFixed(1)).join(" + ")+" / side"};

const WEEKS=[
  {label:"Volume — sets of 5",short:"Volume",intent:"Moderate weight, sets of 5. The last set is open: do as many clean reps as you can, stop 1-2 before form slips. This builds your base.",sets:[{pct:.65,reps:"5"},{pct:.75,reps:"5"},{pct:.85,reps:"5",amrap:true}]},
  {label:"Intensity — sets of 3",short:"Intensity",intent:"Heavier, fewer reps. You're teaching your body to handle bigger loads. Final set is open, you'll get fewer than volume week and that's expected.",sets:[{pct:.70,reps:"3"},{pct:.80,reps:"3"},{pct:.90,reps:"3",amrap:true}]},
  {label:"Peak — work up to a heavy single",short:"Peak",intent:"The heaviest week. Work up to 95% for one rep, then keep going for as many as you can. This is where you prove you got stronger. Even 2-3 reps is a win.",sets:[{pct:.75,reps:"5"},{pct:.85,reps:"3"},{pct:.95,reps:"1",amrap:true}]},
  {label:"Deload — light and easy",short:"Deload",intent:"Light weight, easy reps. Feels too easy, that's the point. You grow during recovery, not the hard weeks. After this, the weights go up and a new cycle starts.",sets:[{pct:.40,reps:"5"},{pct:.50,reps:"5"},{pct:.60,reps:"5"}]}
];

const LIFTS=[
  {id:"ohp",title:"Shoulder Press",inc:5,
   explain:"Standing, press the bar from your shoulders to a locked-out overhead position. Brace your core, squeeze your glutes, don't lean back."},
  {id:"deadlift",title:"Deadlift",inc:10,
   explain:"Bar on the floor, feet hip-width, grip outside your legs. Flat back, chest up, drive through your heels to stand and lock out. Lower under control."},
  {id:"bench",title:"Bench Press",inc:5,
   explain:"Lie back, grip slightly wider than shoulders. Lower the bar to mid-chest, pause, press up. Feet flat, butt on the bench."},
  {id:"squat",title:"Squat",inc:10,
   explain:"Bar on your upper back. Feet shoulder-width, toes slightly out. Sit down and back until your hip crease passes your knee. Drive up through your heels."}
];

/* Supporting pools — machine / cable / dumbbell friendly, no good-mornings/RDL/barbell-row/hip-thrust.
   Each session shows a rotating window of 5; you pick 2. */
const SUPPORT={
  ohp:[
    {name:"Lat Pulldown",detail:"4 × 10-12",how:"Wide grip, pull the bar to your upper chest, squeeze your back, control it up."},
    {name:"Seated Cable Row",detail:"4 × 10-12",how:"Chest up, pull the handle to your stomach, squeeze shoulder blades together."},
    {name:"Lateral Raises",detail:"4 × 12-15",how:"Light dumbbells, raise to your sides until parallel, slight elbow bend. The burn is the point."},
    {name:"Face Pulls",detail:"4 × 15",how:"Cable with rope at face height, pull toward your face and spread the ends. Great for posture."},
    {name:"Assisted Dips",detail:"4 × 10-12",how:"Lower until upper arms are parallel, press back up. Use the assist machine as needed."},
    {name:"Assisted Chin-Ups",detail:"4 × 8-10",how:"Palms facing you, pull until your chin clears the bar. Use the assist machine or a band."},

const DEFAULT_MAXES={ohp:115,deadlift:245,bench:185,squat:225};

/* ════════════════════════ STATE ════════════════════════ */
let data=null,currentView="today",showLog=false,editingMaxes=false;
let session=blankSession();

function blankSession(){return{pos:null,ranMile:false,emptyBar:false,doneSets:[],picks:{},supOffset:0,absDone:false,finalReps:"",justFinishedCycle:false,cycleRecs:null};}

function posKey(){return `${data.cycle}-${data.week}-${data.day}`;}

function loadData(){
  try{
    const cur=localStorage.getItem(STORAGE_KEY);
    if(cur){data=JSON.parse(cur);}
    else{
      const old=localStorage.getItem(OLD_KEY);
      if(old){data=migrateOld(JSON.parse(old));saveData();flash("Welcome back — your history carried over ✓");}
      else{data=freshData();saveData();}
    }
  }catch{data=freshData();}
  if(data.lastExportCount==null)data.lastExportCount=0;
  if(!Array.isArray(data.bwLog))data.bwLog=[];
  // restore in-progress session if it matches where we are
  try{
    const s=localStorage.getItem(SESSION_KEY);
    if(s){const p=JSON.parse(s);if(p.pos===posKey()){session=Object.assign(blankSession(),p);} }
  }catch{}
  if(!session.pos)session.pos=posKey();
}
function saveData(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}catch{}}
function saveSession(){try{session.pos=posKey();localStorage.setItem(SESSION_KEY,JSON.stringify(session))}catch{}}
function clearSession(){try{localStorage.removeItem(SESSION_KEY)}catch{}session=blankSession();session.pos=posKey();}
function flash(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2000)}

function freshData(){return{maxes:{...DEFAULT_MAXES},cycle:1,week:0,day:0,history:[],bwLog:[],lastExportCount:0};}

/* One-time automatic migration from the old app's data (derek-531-v7).
   Maps the old schema to the new one. The old key is left untouched as a backup. */
function migrateOld(old){
  const out={
    maxes:Object.assign({...DEFAULT_MAXES},old.maxes||{}),
    cycle:old.cycle||1,week:old.week||0,day:old.day||0,
    history:[],bwLog:Array.isArray(old.bwLog)?old.bwLog:[],lastExportCount:0
  };
  (old.history||[]).forEach(h=>{
    const finalReps=(h.amrapReps!=null)?h.amrapReps:(h.finalReps!=null?h.finalReps:null);
    const topSet=h.topSet||0;
    let sk={workingSets:0,supporting:false,abs:false};
    if(Array.isArray(h.skipped)){
      h.skipped.forEach(s=>{
        if(s.type==="working_sets")sk.workingSets=Math.max(0,(s.total||0)-(s.completed||0));
        if(s.type==="assistance")sk.supporting=true;
        if(s.type==="abs")sk.abs=true;
      });
    }else if(h.skipped&&typeof h.skipped==="object"){sk=Object.assign(sk,h.skipped);}
    out.history.push({
      date:h.date,cycle:h.cycle,week:h.week,day:h.day,lift:h.lift,
      topSet,finalReps,est1rm:finalReps?epley(topSet,finalReps):null,
      supporting:h.assists||h.supporting||[],
      absDone:sk.abs?false:true,         // old data had no explicit flag; assume done unless marked skipped
      ranMile:h.ranMile!=null?h.ranMile:false,  // not tracked in old app; starts fresh
      skipped:sk
    });
  });
  return out;
}

/* ════════════════════════ DERIVED ════════════════════════ */
function workingSets(lift,wk,tm){return wk.sets.map(s=>({wt:round5(tm*s.pct),reps:s.reps,amrap:!!s.amrap,pct:Math.round(s.pct*100)}));}

function supportWindow(liftId){
  const pool=SUPPORT[liftId];
  const start=(data.history.length+session.supOffset)%pool.length;
  const win=[];for(let i=0;i<5;i++)win.push(pool[(start+i)%pool.length]);
  return win;
}
// one ab move per session, rotating — leans on Load+Raise, slips Brace in occasionally
const ABS_SEQ=["Load","Raise","Load","Raise","Brace"];
function absForSession(){
  const n=data.history.length;
  const slot=ABS.find(s=>s.slot===ABS_SEQ[n%ABS_SEQ.length]);
  const v=slot.variants[Math.floor(n/ABS_SEQ.length)%slot.variants.length];
  return{slot:slot.slot,...v};
}

function lastFinalForWeekType(liftId,weekIdx){
  const h=data.history.filter(x=>x.lift===liftId&&x.week===weekIdx&&x.finalReps!=null);
  return h.length?h[h.length-1].finalReps:null;
}

/* final-set projection: closes the "where does my data go" loop */
function projectFromReps(reps,weekIdx,lift){
  if(!reps||isNaN(reps)||reps<1)return null;
  const tm=data.maxes[lift.id],std=tm+lift.inc,big=tm+lift.inc*2;
  if(weekIdx===0){
    if(reps>=10)return{tone:"push",msg:`${reps} reps at 85% is too light. Next cycle the app proposes ${tm} → ${big} lb (+${lift.inc*2}, double the standard).`};
    if(reps>=7)return{tone:"good",msg:`${reps} reps — strong. Next cycle: ${tm} → ${std} lb (standard +${lift.inc}).`};
    return{tone:"good",msg:`${reps} reps — on target. Next cycle: ${tm} → ${std} lb.`};
  }
  if(weekIdx===1){
    if(reps>=6)return{tone:"push",msg:`${reps} reps at 90% is very strong. Next cycle the app proposes ${tm} → ${big} lb (+${lift.inc*2}).`};
    if(reps>=4)return{tone:"good",msg:`${reps} reps at 90% — solid. Next cycle: ${tm} → ${std} lb.`};
    return{tone:"good",msg:`${reps} reps at 90% — on track. Next cycle: ${tm} → ${std} lb.`};
  }
  if(weekIdx===2){
    if(reps>=5)return{tone:"push",msg:`${reps} reps at 95% — excellent. The app flags an extra bump: ${tm} → ${big} lb next cycle.`};
    if(reps>=3)return{tone:"good",msg:`${reps} reps at 95% — solid. Next cycle: ${tm} → ${std} lb.`};
    if(reps<=1)return{tone:"warn",msg:`${reps} rep at 95% — heavy. If this repeats, the app will suggest resetting the weight, not raising it.`};
    return{tone:"good",msg:`${reps} reps at 95% — that's a heavy single done. TM looks well calibrated.`};
  }
  return null;
}

function calcRecommendedTmBumps(){
  const recs={};
  LIFTS.forEach(l=>{
    const h=data.history.filter(x=>x.lift===l.id&&x.finalReps!=null);
    const lastVol=[...h].reverse().find(x=>x.week===0);
    const lastInt=[...h].reverse().find(x=>x.week===1);
    const lastPeak=[...h].reverse().find(x=>x.week===2);
    let extra=0,reason=`standard +${l.inc} lb`;
    if(lastVol&&lastVol.finalReps>=10){extra=l.inc;reason=`${lastVol.finalReps} reps on volume week — too light`;}
    else if(lastInt&&lastInt.finalReps>=6){extra=l.inc;reason=`${lastInt.finalReps} reps at 90% — strong`;}
    else if(lastPeak&&lastPeak.finalReps>=5){extra=l.inc;reason=`${lastPeak.finalReps} reps at 95% — excellent`;}
    recs[l.id]={from:data.maxes[l.id],standard:data.maxes[l.id]+l.inc,recommended:data.maxes[l.id]+l.inc+extra,reason};
  });
  return recs;
}

/* rule-based coach */
function computeInsights(){
  const out=[],now=Date.now(),D=864e5,H=data.history;
  if(!H.length){out.push({tone:"good",text:"Log a few workouts and your coaching shows up here — built from your numbers, no internet needed."});return out;}
  // consistency
  const last=new Date(H[H.length-1].date),days=Math.floor((now-last)/D);
  const last21=H.filter(h=>(now-new Date(h.date))/D<=21).length;
  if(days>=4)out.push({tone:"warn",text:`<b>${days} days</b> since your last session. You're most consistent around 4×/week — get back in before momentum slips.`});
  else if(last21>=10)out.push({tone:"good",text:`<b>${last21} sessions</b> in the last 3 weeks. Consistency is the whole game in 5/3/1 and you're nailing it.`});
  // skip patterns
  const recent=H.slice(-8);
  const absSkipped=recent.filter(h=>h.skipped&&h.skipped.abs).length;
  const supSkipped=recent.filter(h=>h.skipped&&h.skipped.supporting).length;
  if(absSkipped>=4)out.push({tone:"warn",text:`You skipped <b>abs in ${absSkipped} of your last ${recent.length}</b> sessions. They're now a fixed block before your assistance work, so they're harder to dodge.`});
  if(supSkipped>=4)out.push({tone:"warn",text:`Assistance work skipped in <b>${supSkipped} of ${recent.length}</b> sessions. That's where your size and balance come from — pick the two that fit your gym and do them.`});
  // coasting / stall per lift
  LIFTS.forEach(l=>{
    const h=data.history.filter(x=>x.lift===l.id&&x.finalReps!=null);
    if(!h.length)return;
    const lv=[...h].reverse().find(x=>x.week===0),li=[...h].reverse().find(x=>x.week===1),lp=[...h].reverse().find(x=>x.week===2);
    if(lv&&lv.finalReps>=10)out.push({tone:"push",text:`<b>${l.title}</b>: ${lv.finalReps} reps on volume week. Too light. The app will bump you <b>+${l.inc*2}</b> next cycle instead of +${l.inc}.`});
    else if(li&&li.finalReps>=6)out.push({tone:"push",text:`<b>${l.title}</b>: ${li.finalReps} reps at 90%. You're stronger than this weight. Expect a double bump next cycle.`});
    else if(lp&&lp.finalReps<=1)out.push({tone:"warn",text:`<b>${l.title}</b>: barely moving the bar on peak week. If it repeats, reset the training max ~10% rather than pushing through.`});
  });
  // strength trend headline
  const ups=[];
  LIFTS.forEach(l=>{
    const e=data.history.filter(x=>x.lift===l.id&&x.est1rm).map(x=>x.est1rm);
    if(e.length>=3){const delta=e[e.length-1]-e[0];if(delta>=5)ups.push(`${l.title} +${delta}`);}
  });
  if(ups.length)out.push({tone:"good",text:`Estimated maxes are climbing: <b>${ups.join(", ")} lb</b>. The compound lifts are doing their job.`});
  return out.slice(0,6);
}

function sparkline(vals){
  if(vals.length<2)return `<svg class="spark" viewBox="0 0 100 34" preserveAspectRatio="none"><line x1="0" y1="17" x2="100" y2="17" stroke="#E1DDD5" stroke-width="1.5"/></svg>`;
  const min=Math.min(...vals),max=Math.max(...vals),rng=max-min||1;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1))*100},${30-((v-min)/rng)*26-2}`).join(" ");
  return `<svg class="spark" viewBox="0 0 100 34" preserveAspectRatio="none">
    <defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF7A59"/><stop offset="1" stop-color="#7C5CFC"/></linearGradient></defs>
    <polyline points="${pts}" fill="none" stroke="url(#sg)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

function getDaysSinceBanner(){
  if(!data.history.length)return"";
  const last=new Date(data.history[data.history.length-1].date);
  const a=new Date(last.getFullYear(),last.getMonth(),last.getDate());
  const t=new Date();const b=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  const days=Math.round((b-a)/864e5);
  if(days<=1)return"";
  if(days>=7)return`<div class="banner warn"><b>${days} days since your last workout.</b> Consider repeating this week instead of advancing.</div>`;
  if(days>=3)return`<div class="banner gap">${days} days since your last workout. Time to get back in.</div>`;
  return"";
}

      <div class="skip-msg">Logging with these skipped: <b>${esc(session.pendingSkips.join(", "))}</b>. That's fine — it just gets tracked so your coach can spot patterns. Continue?</div>

        <button class="skip-ok" onclick="finishWorkout()">Log it</button>
        <button class="skip-cancel" onclick="cancelSubmit()">Back</button>
      </div>
    </div>`:""}
  </section>

  <div class="foot-note">~45-55 min · in and out</div>`;

  document.getElementById("app-today").innerHTML=html;
}

function renderProgress(){
  const insights=computeInsights();
  const recent=data.history.slice(-12);
  const absSkip=recent.filter(h=>h.skipped&&h.skipped.abs).length;
  const supSkip=recent.filter(h=>h.skipped&&h.skipped.supporting).length;
  const now=Date.now(),D=864e5;
  const last28=data.history.filter(h=>(now-new Date(h.date))/D<=28).length;

  const sinceExport=data.history.length-(data.lastExportCount||0);

  let html=`<h1>Progress</h1>

  ${sinceExport>=12?`<div class="banner gap" style="margin-bottom:14px">${sinceExport} sessions since your last backup. <span class="ilink" onclick="exportData()">Export one</span> to be safe — your data lives in this browser only.</div>`:""}

  <section class="card">
    <h2 class="card-title"><span class="card-emoji">🧭</span> Your Coach</h2>
    <p class="card-sub">Read straight from your numbers. No internet, never breaks.</p>
    <div style="margin-top:12px">
      ${insights.map(i=>`<div class="insight"><span class="ins-dot ${i.tone}"></span><span class="ins-text">${i.text}</span></div>`).join("")}
    </div>
  </section>

  <section class="card">
    <h2 class="card-title"><span class="card-emoji">📈</span> Strength Trend</h2>
    <p class="card-sub">Estimated max per lift, from the weight × reps you log. This is your data working.</p>
    <div style="margin-top:8px">
      ${LIFTS.map(l=>{
        const e=data.history.filter(h=>h.lift===l.id&&h.est1rm).map(h=>h.est1rm).slice(-8);
        const nowV=e.length?e[e.length-1]:null;
        const delta=e.length>=2?e[e.length-1]-e[0]:0;
        const cls=delta>2?"up":delta<-2?"down":"flat";
        const sign=delta>0?"+":"";
        return`<div class="trend-row">
          <div class="trend-name">${esc(l.title)}</div>
          ${sparkline(e)}
          <div class="trend-val">
            <div class="trend-now">${nowV?nowV+"":"—"}<span class="lb">lb</span></div>
            <div class="trend-delta ${cls}">${e.length>=2?sign+delta:"new"}</div>
          </div>
        </div>`;
      }).join("")}
    </div>
  </section>

  <section class="card">
    <h2 class="card-title"><span class="card-emoji">🔍</span> Where You're Slipping</h2>
    <p class="card-sub">Last ${recent.length} sessions. The point isn't the raw count — it's the pattern.</p>
    <div class="diag-grid">
      <div class="diag-cell"><div class="diag-val">${last28}</div><div class="diag-label">workouts<br>last 4 wks</div></div>
      <div class="diag-cell"><div class="diag-val${absSkip>=4?" warnv":""}">${absSkip}</div><div class="diag-label">abs<br>skipped</div></div>
      <div class="diag-cell"><div class="diag-val${supSkip>=4?" warnv":""}">${supSkip}</div><div class="diag-label">assist<br>skipped</div></div>
    </div>
  </section>

  <section class="card">
    <h2 class="card-title"><span class="card-emoji">🗺</span> Cycle Roadmap</h2>
    <p class="card-sub">4 weeks per cycle. After deload, the app raises your maxes — you confirm.</p>
    <div class="rm">
      ${WEEKS.map((w,i)=>`<div class="rm-item${i===data.week?" active":i<data.week?" done":""}">
        <span class="rm-dot"></span>
        <div><div class="rm-label${i===data.week?" active":""}">${esc(w.short)}</div>
        <div class="rm-sub">${i===data.week?`you're here · lift ${data.day+1}/4`:i<data.week?"done":"coming up"}</div></div>
      </div>`).join("")}
    </div>
    <div class="rm-order">
      ${LIFTS.map((l,i)=>`<span class="rm-chip${i===data.day?" now":""}">${esc(l.title)}</span>`).join("")}
    </div>
    ${data.week===3?`<button class="btn-ghost" style="margin-top:14px" onclick="skipDeload()">Skip deload → start next cycle</button>`:""}
  </section>

  <section class="card">
    <h2 class="card-title"><span class="card-emoji">🏋️</span> Training Maxes</h2>
    <p class="card-sub">Every weight comes from these. The program raises them automatically — you rarely touch this.</p>
    <div class="max-grid" id="maxes-grid">
      ${LIFTS.map(l=>editingMaxes
        ?`<div class="max-cell"><div class="max-label">${esc(l.title)}</div><input class="max-input" type="number" inputmode="numeric" id="max-${l.id}" value="${data.maxes[l.id]}"><div class="max-inc">+${l.inc}/cycle</div></div>`
        :`<div class="max-cell"><div class="max-label">${esc(l.title)}</div><div class="max-val">${data.maxes[l.id]}<span class="lb"> lb</span></div><div class="max-inc">+${l.inc}/cycle</div></div>`
      ).join("")}
    </div>
    ${editingMaxes
      ?`<button class="btn" onclick="saveMaxes()">Save</button>`
      :`<p class="tucked"><u onclick="toggleEditMaxes()">Adjust manually</u> — only if a number's off</p>`}
  </section>

  ${data.bwLog.length?`
  <section class="card">
    <h2 class="card-title"><span class="card-emoji">⚖️</span> Bodyweight</h2>
    <div class="bw-scroll">
      ${data.bwLog.slice(-10).map(b=>`<div class="bw-cell"><div class="bw-date">${new Date(b.date).toLocaleDateString("en-US",{month:"short",day:"numeric"})}</div><div class="bw-val">${b.wt}</div></div>`).join("")}
    </div>
    <div class="bw-add"><input type="number" inputmode="decimal" id="bw-add-input" placeholder="log today's weight"><button onclick="addBw()">Add</button></div>
  </section>`:`
  <section class="card">
    <h2 class="card-title"><span class="card-emoji">⚖️</span> Bodyweight</h2>
    <p class="card-sub">Optional. Lean shows up here over time.</p>
    <div class="bw-add"><input type="number" inputmode="decimal" id="bw-add-input" placeholder="log today's weight"><button onclick="addBw()">Add</button></div>
  </section>`}

  <section class="card">
    <h2 class="card-title"><span class="card-emoji">📖</span> Recent Sessions</h2>
    <span class="log-toggle" onclick="toggleLog()">${showLog?"Hide":"Show last sessions"}</span>
    ${showLog?`<div style="margin-top:10px">${data.history.slice(-12).reverse().map(h=>{
      const l=LIFTS.find(x=>x.id===h.lift);
      const sk=[];if(h.skipped){if(h.skipped.workingSets)sk.push(h.skipped.workingSets+" sets");if(h.skipped.supporting)sk.push("assistance");if(h.skipped.abs)sk.push("abs");}
      return`<div class="log-entry">
        <div class="log-top">
          <span class="log-date">${new Date(h.date).toLocaleDateString("en-US",{month:"short",day:"numeric"})}</span>
          <span class="log-lift">${l?esc(l.title):""}</span>
          <span class="log-detail">${h.topSet}lb${h.finalReps!=null?` × ${h.finalReps}`:""}</span>
        </div>
        ${sk.length?`<div class="log-skip">skipped: ${esc(sk.join(", "))}</div>`:""}
      </div>`;
    }).join("")}</div>`:""}
  </section>

  <section class="card">
    <button class="btn-ghost" onclick="exportData()">Export backup (JSON)</button>
    <button class="btn-ghost" style="margin-top:9px" onclick="importData()">Import backup</button>
    <input type="file" id="import-file" accept="application/json" style="display:none" onchange="handleImport(event)">
    <p class="tucked" style="margin-top:14px"><u onclick="resetAll()" style="color:#B5563F;border-color:#B5563F">Reset all data</u></p>
  </section>`;

  document.getElementById("app-progress").innerHTML=html;
}

function renderCycleComplete(){
  const recs=session.cycleRecs;
  const anyUp=LIFTS.some(l=>recs[l.id].recommended>recs[l.id].standard);
  const rows=LIFTS.map(l=>{
    const r=recs[l.id],up=r.recommended>r.standard;
    return`<div class="cc-row">
      <span class="cc-lift">${esc(l.title)}</span>
      <div class="cc-right">
        ${up
          ?`<div class="cc-val up">${r.from} → ${r.recommended} lb</div><div class="cc-reason">${esc(r.reason)}</div><div class="cc-std">standard would be ${r.standard} lb</div>`
          :`<div class="cc-val">${r.from} → ${r.standard} lb</div><div class="cc-reason">${esc(r.reason)}</div>`}
      </div>
    </div>`;
  }).join("");
  document.getElementById("app-today").innerHTML=`
    <header class="header">
      <div class="eyebrow"><span class="pill">Cycle ${data.cycle-1} complete</span><span class="pill-dim">Cycle ${data.cycle} next</span></div>
      <h1 class="h1-grad">Deload done.</h1>
      <p class="subhead">${anyUp?"Your reps say you earned more than the standard jump on some lifts. Confirm or keep standard:":"Standard increases applied. Your reps say the pace is right."}</p>
    </header>
    <section class="card">
      <div style="margin-top:2px">${rows}</div>
      ${anyUp
        ?`<div style="display:flex;gap:9px;margin-top:16px"><button class="skip-ok" style="flex:1" onclick="applyDataMaxes()">Apply the bumps</button><button class="skip-cancel" style="flex:1" onclick="dismissCycle()">Keep standard</button></div>`
        :`<button class="btn" onclick="dismissCycle()">Start Cycle ${data.cycle} →</button>`}
    </section>`;
}

/* ════════════════════════ ACTIONS ════════════════════════ */
function toggleRan(){session.ranMile=!session.ranMile;saveSession();renderToday();}
function toggleEmptyBar(){session.emptyBar=!session.emptyBar;saveSession();renderToday();}
function toggleAbs(){session.absDone=!session.absDone;saveSession();renderToday();}
function toggleSet(i){const idx=session.doneSets.indexOf(i);idx>=0?session.doneSets.splice(idx,1):session.doneSets.push(i);saveSession();renderToday();}
function toggleHow(n){session.openHow=session.openHow===n?null:n;renderToday();}
function togglePick(i,n){if(session.picks[i]!==undefined)delete session.picks[i];else if(Object.keys(session.picks).length<2)session.picks[i]=n;saveSession();renderToday();}
function rotateSupport(){session.supOffset=(session.supOffset||0)+5;session.picks={};saveSession();renderToday();}

function onFinalInput(){
  const input=document.getElementById("final-input");
  session.finalReps=input.value;saveSession();
  const lift=LIFTS[data.day];
  const proj=input.value?projectFromReps(parseInt(input.value),data.week,lift):null;
  document.getElementById("projection").innerHTML=proj?`<div class="projection ${proj.tone}">${proj.msg}</div>`:"";
}

function getSkips(){
  const wk=WEEKS[data.week],lift=LIFTS[data.day],tm=data.maxes[lift.id];
  const total=workingSets(lift,wk,tm).length;
  const skips=[];
  const missed=total-session.doneSets.length;
  if(missed>0)skips.push(`${missed} working set${missed>1?"s":""}`);
  const ma=2-Object.keys(session.picks).length;
  if(ma>0)skips.push(`${ma} assistance`);
  if(!session.absDone)skips.push("abs");
  if(!session.ranMile)skips.push("the run");
  return skips;
}
function requestSubmit(){
  const skips=getSkips();
  if(!skips.length){finishWorkout();return;}
  session.pendingSubmit=true;session.pendingSkips=skips;renderToday();
  setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"}),50);
}
function cancelSubmit(){session.pendingSubmit=false;renderToday();}

function finishWorkout(){
  const lift=LIFTS[data.day],wk=WEEKS[data.week],tm=data.maxes[lift.id];
  const working=workingSets(lift,wk,tm);
  const finalReps=session.finalReps?parseInt(session.finalReps):null;
  const topSet=working[working.length-1].wt;
  const skipped={
    workingSets:working.length-session.doneSets.length,
    supporting:Object.keys(session.picks).length<2,
    abs:!session.absDone
  };
  const willFinishCycle=(data.day===3&&data.week===3);
  const recs=willFinishCycle?calcRecommendedTmBumps():null;

  data.history.push({
    date:new Date().toISOString(),cycle:data.cycle,week:data.week,day:data.day,lift:lift.id,
    topSet,finalReps,est1rm:finalReps?epley(topSet,finalReps):null,
    supporting:Object.values(session.picks),absDone:session.absDone,ranMile:session.ranMile,
    skipped
  });

  // advance
  let nDay=data.day+1,nWeek=data.week,nCycle=data.cycle;
  if(nDay>=4){nDay=0;nWeek++;if(nWeek>=4){nWeek=0;nCycle++;LIFTS.forEach(l=>{data.maxes[l.id]+=l.inc});}}
  data.day=nDay;data.week=nWeek;data.cycle=nCycle;
  saveData();clearSession();

  if(recs){session.justFinishedCycle=true;session.cycleRecs=recs;flash("Cycle complete");}
  else flash("Logged ✓");
  renderToday();
}

function applyDataMaxes(){LIFTS.forEach(l=>{data.maxes[l.id]=session.cycleRecs[l.id].recommended;});saveData();flash("Maxes updated ✓");dismissCycle();}
function dismissCycle(){session.justFinishedCycle=false;session.cycleRecs=null;renderToday();}

function skipDeload(){
  if(!confirm("Skip deload and start the next cycle? Your training maxes go up now."))return;
  data.week=0;data.day=0;data.cycle++;LIFTS.forEach(l=>{data.maxes[l.id]+=l.inc;});
  saveData();clearSession();flash("New cycle started");renderProgress();
}

function toggleEditMaxes(){editingMaxes=!editingMaxes;renderProgress();}
function saveMaxes(){LIFTS.forEach(l=>{const v=document.getElementById(`max-${l.id}`)?.value;if(v)data.maxes[l.id]=parseInt(v)||data.maxes[l.id];});saveData();editingMaxes=false;flash("Updated");renderProgress();}
function toggleLog(){showLog=!showLog;renderProgress();}
function addBw(){const v=document.getElementById("bw-add-input")?.value;if(!v)return;const today=new Date().toISOString().slice(0,10);data.bwLog=data.bwLog.filter(b=>b.date.slice(0,10)!==today);data.bwLog.push({date:new Date().toISOString(),wt:parseFloat(v)});saveData();flash("Bodyweight logged ✓");renderProgress();}

function exportData(){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);const a=document.createElement("a");
  a.href=url;a.download=`531-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  data.lastExportCount=data.history.length;saveData();flash("Exported ✓");
}
function importData(){document.getElementById("import-file").click();}
function handleImport(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const imported=JSON.parse(ev.target.result);
      if(!imported.maxes||!Array.isArray(imported.history))throw new Error("bad");
      if(!confirm("Replace all current data with this backup?"))return;
      data=imported;if(!data.bwLog)data.bwLog=[];saveData();clearSession();flash("Imported ✓");renderProgress();
    }catch{flash("Couldn't read that file");}
  };
  reader.readAsText(file);
}
function resetAll(){
  if(!confirm("Erase everything — history, maxes, all of it? Can't be undone."))return;
  data=freshData();saveData();clearSession();showLog=false;flash("Reset");renderProgress();
}

/* ════════════════════════ REST TIMER (optional) ════════════════════════ */
let timerInterval=null,timerSeconds=0,timerRunning=false,timerLabel="";
function startTimer(sec,label){timerSeconds=sec;timerRunning=true;timerLabel=label||"Rest";clearInterval(timerInterval);document.body.classList.add("timer-running");renderTimer();timerInterval=setInterval(()=>{timerSeconds--;if(timerSeconds<=0){clearInterval(timerInterval);timerRunning=false;timerSeconds=0;try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch{}beep();renderTimer();setTimeout(stopTimer,3000);}else renderTimer();},1000);}
function stopTimer(){clearInterval(timerInterval);timerRunning=false;timerSeconds=0;document.body.classList.remove("timer-running");const el=document.getElementById("timer-root");if(el)el.innerHTML="";}
function renderTimer(){const m=Math.floor(timerSeconds/60),s=timerSeconds%60;const done=timerSeconds<=0&&!timerRunning;document.getElementById("timer-root").innerHTML=`<div class="timer-bar"><span class="timer-bar-time">${done?"0:00":`${m}:${s<10?"0":""}${s}`}</span>${done?'<span class="timer-bar-done">Time — back to it</span>':`<span class="timer-bar-label">${esc(timerLabel)}</span>`}<button class="timer-bar-x" onclick="stopTimer()">✕</button></div>`;}
function beep(){try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type="sine";o.frequency.value=880;g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.3,ctx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.6);o.start();o.stop(ctx.currentTime+.6);}catch{}}

/* ════════════════════════ INIT ════════════════════════ */
loadData();renderToday();
</script>
</body>
